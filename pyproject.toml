[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pipeline"
version = "0.1.0"
description = "Self-hosted GitHub event automation with coding agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "pyjwt[crypto]>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
